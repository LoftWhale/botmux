appId: com.botmux.desktop
productName: Botmux
artifactName: ${productName}-${version}-mac-${arch}.${ext}
npmRebuild: false
extraMetadata:
  main: dist/desktop/main.cjs
asar: true
files:
  - dist/desktop/**
  - '!node_modules/**'
extraResources:
  - from: build/desktop-runtime
    to: runtime
  - from: build/desktop-node
    to: node
afterPack: build/after-pack.cjs
mac:
  icon: build/icon.png
  # Both per-arch builds intentionally carry both bundled Node/runtime trees.
  # Keep those already architecture-qualified Mach-O files instead of asking
  # @electron/universal to lipo identical copies a second time.
  #
  # The glob must match the INSTALLED layout: pnpm nested every package under
  # `node_modules/.pnpm/<name>@<ver>/node_modules/…`, while bun installs flat at
  # `node_modules/<name>/…` (verified: the canvas natives land at
  # `node_modules/@napi-rs/canvas-<platform>/…node`). A glob that matches nothing
  # does NOT error — it would silently stop excluding these files and let
  # universal try to lipo them. `runtime/node_modules/**` covers both layouts (the
  # nested pnpm path is a subtree of it), so this survives another package-manager
  # change.
  x64ArchFiles: 'Contents/Resources/{node/**,runtime/node_modules/**}'
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  sign: false
